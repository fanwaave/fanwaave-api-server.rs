name: fanwaave-config-consumer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      FLEET_GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Check out exact flags2env parser used by Cargo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flags-2-env/flags-2-env
          ref: b708a041531a830bd49f030250836896096e7abd
          path: tmp/flags2env
          persist-credentials: false

      - name: Audit repository CLI contract before private dependency access
        run: |
          set -euo pipefail
          make -C tmp/flags2env cli
          tmp/flags2env/build/flags2env audit .cli-flags.toml

      - name: Require approved fleet read credential
        run: test -n "${FLEET_GITHUB_TOKEN}"

      - name: Configure ephemeral GitHub credential helper
        run: >-
          git config --global credential.https://github.com.helper
          '!f() { test "$1" = get && echo username=x-access-token && echo "password=$FLEET_GITHUB_TOKEN"; }; f'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test flags-2-env precedence and Fanwaave domain config resolution
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cross-check package and argv metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f .zpkg.toml
          test -f .cli-flags.toml
          test -f .fanwaave-cfg.toml
          grep -Fq 'git = "https://github.com/flags-2-env/flags-2-env.git"' Cargo.toml
          grep -Fq '"flags-2-env/flags-2-env" = "=0.3.0"' .zpkg.toml
          grep -Fq 'contract = ".cli-flags.toml"' .fanwaave-cfg.toml
          grep -Fq 'files = []' .cli-flags.toml
          grep -Fq 'allow_unknown = false' .cli-flags.toml
          ! grep -Fq 'github.com/ORESoftware/flags-2-env' Cargo.toml .zpkg.toml .cli-flags.toml .fanwaave-cfg.toml
          ! grep -Fq 'FANWAAVE_NATS_URL' .cli-flags.toml

      - name: Check out pinned Zed validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: 9c6eff237de7ee926afda37bd0732d9c4667127f
          path: .deps/zed-cli
          persist-credentials: false

      - name: Validate canonical Zed package manifest
        run: cargo run --locked --quiet --manifest-path .deps/zed-cli/Cargo.toml --bin zed -- validate --manifest .zpkg.toml --json

      - name: Verify checks did not mutate tracked state
        run: git diff --exit-code
