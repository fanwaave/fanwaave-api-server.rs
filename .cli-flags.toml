[help]
url = "https://github.com/fanwaave/fanwaave-api-server.rs"

[env]
load = false

[parse]
allow_unknown = false

[flags.config]
env = "FANWAAVE_CONFIG"
aliases = ["config"]
type = "string"
help = "Path to compatibility configuration. Fanwaave domain policy is .fanwaave-cfg.toml."

[flags.api-base]
env = "FANWAAVE_API_BASE"
aliases = ["api-base"]
type = "string"
help = "API HTTP base URL."

[flags.json]
env = "FANWAAVE_JSON"
aliases = ["json"]
type = "bool"
help = "Emit JSON."

[flags.fanwaave-api-bind]
env = "FANWAAVE_API_BIND"
aliases = ["fanwaave-api-bind"]
type = "string"
help = "Fanwaave API HTTP bind address."

[flags.fanwaave-api-tcp-bind]
env = "FANWAAVE_API_TCP_BIND"
aliases = ["fanwaave-api-tcp-bind"]
type = "string"
help = "Optional Fanwaave API TCP transport bind address."
