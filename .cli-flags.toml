# flags-2-env surface for `fanwaave-api`
[flags.config]
env = "FANWAAVE_CONFIG"
long = "config"
help = "Path to TOML configuration"

[flags.api_base]
env = "FANWAAVE_API_BASE"
long = "api-base"
help = "API HTTP base URL"

[flags.json]
env = "FANWAAVE_JSON"
long = "json"
switch = true
help = "Emit JSON"


[flags.fanwaave-api-bind]
env = "FANWAAVE_API_BIND"
long = "fanwaave-api-bind"
type = "string"
help = "Runtime environment key FANWAAVE_API_BIND."

[flags.fanwaave-api-tcp-bind]
env = "FANWAAVE_API_TCP_BIND"
long = "fanwaave-api-tcp-bind"
type = "string"
help = "Runtime environment key FANWAAVE_API_TCP_BIND."

[flags.fanwaave-nats-url]
env = "FANWAAVE_NATS_URL"
long = "fanwaave-nats-url"
type = "string"
help = "Runtime environment key FANWAAVE_NATS_URL."
